[package]
name = "skillweaver"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Lightweight local-first block-based Markdown editor and knowledge base"
authors = ["Blue Frog Foundation"]
license = "Apache-2.0"

[lib]
name = "skillweaver_lib"
crate-type = ["lib"]

[[bin]]
name = "skillweaver"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2.5"
dirs = "7"
notify = "8"
notify-debouncer-mini = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
format_push_string = "warn"
