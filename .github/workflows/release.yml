name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-engine -> target

      - name: Run unit tests
        run: cargo test --manifest-path core-engine/Cargo.toml

      - name: Build release executable
        run: cargo build --release --manifest-path core-engine/Cargo.toml

      - name: Stage portable executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "core-engine/target/release/skillweaver.exe" "dist/skillweaver-windows-x64.exe"
          $hash = (Get-FileHash "dist/skillweaver-windows-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  skillweaver-windows-x64.exe" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ASCII

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillweaver-windows-x64
          path: |
            dist/skillweaver-windows-x64.exe
            dist/SHA256SUMS.txt
          retention-days: 30

  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: skillweaver-windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/skillweaver-windows-x64.exe
            dist/SHA256SUMS.txt
