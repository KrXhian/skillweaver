[package]
name = "skillweaver"
version = "0.1.0"
edition = "2021"
description = "Lightweight Notion + Obsidian markdown folder editor"

[lib]
name = "skillweaver_lib"
crate-type = ["lib"]

[[bin]]
name = "skillweaver"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2.5"
dirs = "7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
